# Served as /etc/nginx/conf.d/default.conf (http{} context, so map{} is legal).

# The service worker precaches the whole site cache-first, so stale sw.js or
# HTML strands users on an old build. Default no-cache; only content-hashed
# /_next/static is immutable.
map $uri $cache_control {
    default              "no-cache";
    ~^/_next/static/     "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # WARNING: do not add add_header inside a location block — nginx add_header
    # inheritance is all-or-nothing and would silently drop this one.
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/css text/plain application/javascript application/json
               image/svg+xml application/manifest+json;

    # nginx's stock mime.types lacks .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location / {
        # trailingSlash: true export — routes emitted as route/index.html.
        try_files $uri $uri/index.html =404;
    }
}
